# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache.
org.gradle.configuration-cache=false

# Loom has to be resolved before the build script runs, so it lives here rather than in versions/.
# 1.17-SNAPSHOT handles both 26.2 and 26.3.
loom_version=1.17-SNAPSHOT

# Mod properties. Minecraft-version-specific values live in versions/<mc>.properties.
mod_version=1.3.0
maven_group=com.minebhop
