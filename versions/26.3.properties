# Toolchain for Minecraft 26.3 (released 2026-09-15). Read by both the Fabric build and neoforge/.
# Select with -Pmc=26.3.
#
# 26.3 replaced GLFW with SDL3, so key codes differ from 26.2 (']' is 93 on 26.2, 48 on 26.3).
# InputConstants.KEY_* are compile-time constants inlined into the jar, which is why each Minecraft
# version needs its own build rather than one jar spanning both.
minecraft_version=26.3

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.160.6+26.3
fabric_minecraft_dependency=~26.3
modmenu_version=21.0.0

# NeoForge -- only beta builds exist for 26.3 so far.
neo_version=26.3.0.3-beta
neo_version_range=[26.3.0.0-beta,)
neo_minecraft_version_range=[26.3]
