modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ryder"
description='''
Replaces Minecraft's player movement with a port of Source engine movement: ground friction and
acceleration, air acceleration with the 30 u/s air speed cap, bunny hopping with configurable
timing, the speed gain from air strafing, and look-directed ladder climbing.
'''

# The movement is entirely client side.
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
